<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${modo == 'crear' ? 'Nueva Categoría' : 'Editar Categoría'} + ' - Admin Mechita'">Categoría</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: topbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="admin-page-header">
  <div class="container">
    <div class="admin-breadcrumb">
      <a th:href="@{/admin}"><i class="bi bi-house-door"></i> Panel</a>
      <i class="bi bi-chevron-right"></i>
      <a th:href="@{/admin/categorias}">Categorías</a>
      <i class="bi bi-chevron-right"></i>
      <span th:text="${modo == 'crear' ? 'Nueva' : 'Editar'}">Nueva</span>
    </div>
    <div class="admin-page-title">
      <div>
        <span class="admin-tag">ADMINISTRACIÓN</span>
        <h1 th:text="${modo == 'crear' ? 'Nueva Categoría' : 'Editar Categoría'}">Categoría</h1>
        <p th:text="${modo == 'crear' ? 'Completa los datos para crear una nueva categoría' : 'Modifica los datos de la categoría'}">
          Completa los datos
        </p>
      </div>
      <a th:href="@{/admin/categorias}" class="btn-admin-back">
        <i class="bi bi-arrow-left"></i> Volver
      </a>
    </div>
  </div>
</section>

<section class="admin-form-section">
  <div class="container">
    <div class="admin-form-wrapper">

      <!-- Alert de error -->
      <div th:if="${error}" class="contacto-alert error" style="margin-bottom: 1.5rem;">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}">Error</span>
      </div>

      <form th:action="@{/admin/categorias/guardar}" method="post">

        <input type="hidden" name="idCategoria" th:value="${categoria.idCategoria}">

        <div class="form-group-mechita">
          <label for="nombre">Nombre de la categoría <span class="required">*</span></label>
          <input type="text" id="nombre" name="nombre"
                 th:value="${categoria.nombre}"
                 required maxlength="80"
                 placeholder="Ej: Chifles">
          <small class="form-hint">Máximo 80 caracteres. Debe ser único.</small>
        </div>

        <div class="form-group-mechita">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion"
                    rows="4"
                    maxlength="255"
                    placeholder="Describe brevemente esta categoría..."
                    th:text="${categoria.descripcion}"></textarea>
          <small class="form-hint">Opcional. Máximo 255 caracteres.</small>
        </div>

        <div class="form-group-mechita">
          <label for="imagenUrl">URL de la imagen</label>
          <input type="url" id="imagenUrl" name="imagenUrl"
                 th:value="${categoria.imagenUrl}"
                 placeholder="https://ejemplo.com/imagen.jpg"
                 maxlength="255">
          <small class="form-hint">Opcional. Pega la URL de una imagen representativa de la categoría.</small>
        </div>

        <div class="form-actions">
          <a th:href="@{/admin/categorias}" class="btn-admin-secondary">
            <i class="bi bi-x-circle"></i> Cancelar
          </a>
          <button type="submit" class="btn-admin-primary">
            <i class="bi bi-check-circle"></i>
            <span th:text="${modo == 'crear' ? 'Crear categoría' : 'Guardar cambios'}">Guardar</span>
          </button>
        </div>

      </form>

    </div>
  </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
