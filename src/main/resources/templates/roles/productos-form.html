<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modo == 'crear' ? 'Nuevo Producto' : 'Editar Producto'} + ' - Admin Mechita'">Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: topbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="admin-page-header">
    <div class="container">
        <div class="admin-breadcrumb">
            <a th:href="@{/admin}"><i class="bi bi-house-door"></i> Panel</a>
            <i class="bi bi-chevron-right"></i>
            <a th:href="@{/admin/productos}">Productos</a>
            <i class="bi bi-chevron-right"></i>
            <span th:text="${modo == 'crear' ? 'Nuevo' : 'Editar'}">Nuevo</span>
        </div>
        <div class="admin-page-title">
            <div>
                <span class="admin-tag">ADMINISTRACIÓN</span>
                <h1 th:text="${modo == 'crear' ? 'Nuevo Producto' : 'Editar Producto'}">Producto</h1>
                <p th:text="${modo == 'crear' ? 'Completa los datos para crear un nuevo producto' : 'Modifica los datos del producto'}">
                    Completa los datos
                </p>
            </div>
            <a th:href="@{/admin/productos}" class="btn-admin-back">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>
</section>

<section class="admin-form-section">
    <div class="container">
        <div class="admin-form-wrapper">

            <form th:action="@{/admin/productos/guardar}" method="post">

                <input type="hidden" name="idProducto" th:value="${producto.idProducto}">

                <div class="form-row-2">
                    <div class="form-group-mechita">
                        <label for="nombre">Nombre del producto <span class="required">*</span></label>
                        <input type="text" id="nombre" name="nombre"
                               th:value="${producto.nombre}"
                               required maxlength="120"
                               placeholder="Ej: Chifles de plátano">
                    </div>

                    <div class="form-group-mechita">
                        <label for="idCategoria">Categoría <span class="required">*</span></label>
                        <select id="idCategoria" name="idCategoria" required>
                            <option value="">Selecciona una categoría</option>
                            <option th:each="c : ${categorias}"
                                    th:value="${c.idCategoria}"
                                    th:text="${c.nombre}"
                                    th:selected="${producto.categoria != null and producto.categoria.idCategoria == c.idCategoria}">
                                Categoría
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group-mechita">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion"
                              rows="4"
                              placeholder="Describe el producto brevemente..."
                              th:text="${producto.descripcion}"></textarea>
                </div>

                <div class="form-row-2">
                    <div class="form-group-mechita">
                        <label for="precio">Precio (S/) <span class="required">*</span></label>
                        <input type="number" id="precio" name="precio"
                               th:value="${producto.precio}"
                               step="0.01" min="0" required
                               placeholder="0.00">
                    </div>

                    <div class="form-group-mechita">
                        <label for="stock">Stock <span class="required">*</span></label>
                        <input type="number" id="stock" name="stock"
                               th:value="${producto.stock}"
                               min="0" required
                               placeholder="0">
                    </div>
                </div>

                <div class="form-group-mechita">
                    <label for="imagenUrl">URL de la imagen</label>
                    <input type="url" id="imagenUrl" name="imagenUrl"
                           th:value="${producto.imagenUrl}"
                           placeholder="https://ejemplo.com/imagen.jpg">
                    <small class="form-hint">Opcional. Pega la URL de una imagen del producto.</small>
                </div>

                <div class="form-actions">
                    <a th:href="@{/admin/productos}" class="btn-admin-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-admin-primary">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${modo == 'crear' ? 'Crear producto' : 'Guardar cambios'}">Guardar</span>
                    </button>
                </div>

            </form>

        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
